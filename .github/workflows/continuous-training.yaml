name: Continuous Training (LK-12)
# PEMICU:
#   A. Performance-based  → repository_dispatch [ct-performance-decay]
#                           (dari Alertmanager via ct-webhook-bridge)
#   B. Data-drift         → repository_dispatch [ct-data-drift]
#                           (dari Alertmanager) ATAU drift gate PSI di sini
#   C. Schedule-based     → cron tiap Minggu (retraining rutin bila ada data baru)
#   D. Manual / simulasi  → workflow_dispatch
on:
  repository_dispatch:
    types: [ct-performance-decay, ct-data-drift]
  schedule:
    - cron: "0 17 * * 0"          # Minggu 00:00 WIB (Sabtu 17:00 UTC)
  workflow_dispatch:
    inputs:
      reason:
        description: "Alasan retraining manual"
        required: false
        default: "manual-trigger"
      force_retrain:
        description: "Paksa retraining walau drift gate tidak memicu"
        type: boolean
        default: false

env:
  PYTHON_VERSION: "3.12"
  MODEL_NAME: "gempawas-aftershock-classifier"
  MLFLOW_TRACKING_URI: "file:./mlruns"
  MLFLOW_ALLOW_FILE_STORE: "true"

jobs:
  # JOB 1 — Identifikasi pemicu & gerbang keputusan (drift gate)
  detect:
    name: "1 · Detect Trigger & Drift Gate"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      proceed: ${{ steps.gate.outputs.proceed }}
      trigger: ${{ steps.ctx.outputs.trigger }}
    steps:
      - uses: actions/checkout@v4

      - name: Tentukan sumber pemicu
        id: ctx
        run: |
          case "${{ github.event_name }}" in
            repository_dispatch) TRIGGER="${{ github.event.action }}" ;;
            schedule)            TRIGGER="schedule-weekly" ;;
            workflow_dispatch)   TRIGGER="manual:${{ github.event.inputs.reason }}" ;;
            *)                   TRIGGER="unknown" ;;
          esac
          echo "trigger=$TRIGGER" >> "$GITHUB_OUTPUT"
          echo "🔔 Pemicu Continuous Training: $TRIGGER"

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install deps
        run: |
          pip install --quiet pandas pyarrow numpy pyyaml "dvc[gs]" || pip install --quiet dvc pandas pyarrow numpy pyyaml

      - name: Pull data terbaru (DVC)
        run: |
          if [ -d ".dvc" ]; then dvc pull --quiet || echo "⚠ DVC pull gagal, pakai data lokal"; fi
          ls -la data/processed/ || true

      - name: Drift Gate (PSI) — Skenario B/C
        id: gate
        run: |
          # Performance-decay & manual force → langsung proceed (alert sudah memutuskan).
          if [ "${{ github.event.action }}" = "ct-performance-decay" ] || \
             [ "${{ github.event.inputs.force_retrain }}" = "true" ]; then
            echo "proceed=true" >> "$GITHUB_OUTPUT"
            echo "Proceed (performance trigger / force)."
            exit 0
          fi

          # Skenario B/C → cek drift PSI antara data acuan vs data terbaru.
          REF="data/processed/features.parquet"
          CUR="data/processed/features_current.parquet"
          if [ -f "$REF" ] && [ -f "$CUR" ]; then
            python scripts/ct_drift_gate.py --reference "$REF" --current "$CUR"
            SR=$(python scripts/ct_drift_gate.py --reference "$REF" --current "$CUR" \
                 2>/dev/null | tail -1 | python -c "import sys,json;print(json.load(sys.stdin)['should_retrain'])")
            echo "proceed=$([ "$SR" = "True" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
          else
            # Tidak ada snapshot current → untuk schedule, proceed; selain itu skip.
            if [ "${{ github.event_name }}" = "schedule" ]; then
              echo "proceed=true" >> "$GITHUB_OUTPUT"
            else
              echo "proceed=false" >> "$GITHUB_OUTPUT"
            fi
          fi

  # JOB 2 — Retraining otomatis (train.py pada data terbaru)
  retrain:
    name: "2 · Automated Retraining"
    runs-on: ubuntu-latest
    needs: detect
    if: needs.detect.outputs.proceed == 'true'
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - name: Install deps
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install "dvc[gs]" || pip install dvc

      - name: Bersihkan mlruns lama
        run: rm -rf mlruns/ .mlruns_cache/ || true

      - name: Pull data (DVC) + build features bila perlu
        run: |
          if [ -d ".dvc" ]; then dvc pull --quiet || echo "⚠ pakai data lokal"; fi
          if [ ! -f data/processed/features.parquet ]; then
            python src/build_features.py || echo "⚠ build_features dilewati"
          fi

      - name: Retrain (3 variasi) pada data terbaru
        run: |
          echo "=== RETRAINING (trigger: ${{ needs.detect.outputs.trigger }}) ==="
          python src/train.py --variations

      - name: Upload mlruns
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mlruns-${{ github.run_id }}
          path: mlruns/
          retention-days: 14

  # JOB 3 — Evaluasi komparatif model lama dengan model baru & promosi
  evaluate-promote:
    name: "3 · Champion vs Challenger & Promote"
    runs-on: ubuntu-latest
    needs: [detect, retrain]
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - name: Install deps
        run: pip install --quiet mlflow xgboost pandas pyyaml

      - name: Download mlruns
        uses: actions/download-artifact@v4
        with:
          name: mlruns-${{ github.run_id }}
          path: mlruns/

      - name: Pilih challenger (run PR-AUC tertinggi) & validasi threshold
        id: best
        run: |
          python scripts/validate_threshold.py \
            --pr-auc-min 0.45 --f1-min 0.35 --recall-min 0.40 || true
          # validate_threshold menulis best_run_id ke GITHUB_OUTPUT
        continue-on-error: true

      - name: Evaluasi komparatif & promosi ke Production
        id: promote
        env:
          CT_TRIGGER: ${{ needs.detect.outputs.trigger }}
        run: |
          RUN_ID="${{ steps.best.outputs.best_run_id }}"
          if [ -z "$RUN_ID" ]; then echo "Tidak ada challenger run."; exit 1; fi
          python scripts/promote_if_better.py \
            --model-name "${{ env.MODEL_NAME }}" \
            --challenger-run-id "$RUN_ID" \
            --tracking-uri "${{ env.MLFLOW_TRACKING_URI }}" \
            --champion-metrics-file models/model_registry_metadata.json \
            --register

      - name: Commit keputusan & metadata (lineage)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add models/model_registry_metadata.json models/ct_promotion_history.json \
                  logs/ct_promotion_decision.md logs/ct_drift_gate_report.md 2>/dev/null || true
          git commit -m "ci(ct): closed-loop retrain via ${{ needs.detect.outputs.trigger }} [skip ci]" \
            || echo "Nothing to commit"
          git push || echo "Push dilewati (no perms / no changes)"

      - name: Upload laporan CT
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ct-reports-${{ github.run_id }}
          path: |
            logs/ct_promotion_decision.md
            logs/ct_drift_gate_report.md
          retention-days: 30

  # JOB 4 — Ringkasan
  summary:
    name: "4 · CT Summary"
    runs-on: ubuntu-latest
    needs: [detect, retrain, evaluate-promote]
    if: always()
    steps:
      - run: |
          echo "=============================================="
          echo "  CONTINUOUS TRAINING — LK-12 (closed-loop)"
          echo "=============================================="
          echo "Trigger          : ${{ needs.detect.outputs.trigger }}"
          echo "Drift gate proceed: ${{ needs.detect.outputs.proceed }}"
          echo "Retrain          : ${{ needs.retrain.result }}"
          echo "Evaluate+Promote : ${{ needs.evaluate-promote.result }}"
          echo "=============================================="
