events {
    worker_connections 1024;
}

http {
    log_format main '$remote_addr [$time_local] "$request" $status '
                    'upstream="$upstream_addr" rt=$request_time';
    access_log /var/log/nginx/access.log main;

    upstream model_backend {
        server model-serving:8080;
        keepalive 32;
    }

    server {
        listen 80;

        # Inference endpoint — diteruskan ke salah satu dari 3 replika
        location /invocations {
            proxy_pass         http://model_backend;
            proxy_http_version 1.1;
            proxy_set_header   Host       $host;
            proxy_set_header   Connection "";
            proxy_read_timeout 120s;
            add_header         X-Upstream-Addr $upstream_addr always;
        }

        # Health check
        location /ping {
            proxy_pass         http://model_backend/ping;
            proxy_http_version 1.1;
            proxy_set_header   Connection "";
        }

        # Prometheus metrics
        location /metrics {
            proxy_pass         http://model_backend/metrics;
            proxy_http_version 1.1;
            proxy_set_header   Connection "";
            allow 172.0.0.0/8;
            allow 10.0.0.0/8;
            allow 127.0.0.1;
            deny  all;
        }

        # Nginx stub_status
        location /stub_status {
            stub_status;
            allow 172.0.0.0/8;
            allow 10.0.0.0/8;
            allow 127.0.0.1;
            deny  all;
        }
    }
}
